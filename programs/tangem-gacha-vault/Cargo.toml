[package]
name = "tangem-gacha-vault"
version = "0.1.0"
description = "Tangem Collectibles: delegated USDC spending vault for Collector Crypt Gacha"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "tangem_gacha_vault"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "0.31.1"
anchor-spl = { version = "0.31.1", default-features = false, features = ["associated_token", "token", "token_2022"] }

[dev-dependencies]
# litesvm 0.8+ targets solana 3.x and conflicts with anchor 0.31 (solana 2.x);
# 0.7.x rides agave 2.3 runtime crates (agave-feature-set), matching the
# solana-sdk 2.3 interface crates this lockfile resolves to. 0.6.x is out:
# it expects the discontinued solana-feature-set and no longer compiles
# against agave >= 2.2.14 runtime crates.
litesvm = "0.7"
solana-sdk = "2.3"
# Decoding Anchor events from transaction logs in the integration suites.
base64 = "0.22"
# solana-sdk's secp256r1 precompile pulls openssl-sys; vendored = build from
# source so no preinstalled OpenSSL is needed (perl + a C compiler suffice).
openssl = { version = "0.10", features = ["vendored"] }
