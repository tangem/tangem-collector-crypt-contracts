[toolchain]
anchor_version = "0.31.1"

[features]
resolution = true
skip-lint = false

[programs.localnet]
tangem_gacha_vault = "FKWs2cd5E9Fi8t2Gqbq6SkgekL4MJwZgkRMrGFcPGVvt"

[provider]
cluster = "Localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"

# Without this entry `anchor test` genesis-loads the program via the legacy
# --bpf-program flag, which leaves the upgrade authority unset (111...1) and
# initialize_config's upgrade-authority gate can never pass. upgradeable = true
# switches it to --upgradeable-program with authority = the provider wallet.
[[test.genesis]]
address = "FKWs2cd5E9Fi8t2Gqbq6SkgekL4MJwZgkRMrGFcPGVvt"
program = "target/deploy/tangem_gacha_vault.so"
upgradeable = true

# Both test suites are hermetic. Day 1 has no Metaplex program fixtures.
